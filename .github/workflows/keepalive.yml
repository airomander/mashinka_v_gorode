# Ежедневная проверка сервера сохранений: бесплатный проект Supabase засыпает после 7 дней без запросов.
name: keepalive
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 "https://crgsuktubtvxspmlthxz.supabase.co/functions/v1/machinka/healthz"
